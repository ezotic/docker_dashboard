<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Docker Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-dark text-light">

<div class="d-flex" style="min-height: 100vh;">

  <!-- Sidebar — offcanvas on mobile, sticky on md+ -->
  <div class="offcanvas offcanvas-md offcanvas-start sidebar flex-shrink-0 d-md-flex flex-column p-3"
       tabindex="-1" id="sidebarMenu" style="width: 220px;">

    <!-- Close button row — mobile only -->
    <div class="d-flex d-md-none justify-content-between align-items-center mb-4">
      <a href="/" class="d-flex align-items-center text-decoration-none">
        <i class="bi bi-hdd-network-fill text-info me-2 fs-4"></i>
        <span class="fw-bold fs-5 text-white">Docker</span>
      </a>
      <button type="button" class="btn-close btn-close-white"
              data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu"></button>
    </div>

    <!-- Brand — desktop only -->
    <a href="/" class="d-none d-md-flex align-items-center mb-4 text-decoration-none">
      <i class="bi bi-hdd-network-fill text-info me-2 fs-4"></i>
      <span class="fw-bold fs-5 text-white">Docker</span>
    </a>

    <ul class="nav nav-pills flex-column mb-auto gap-1">
      <li class="nav-item">
        <a href="/" class="nav-link text-light {% if request.path == '/' %}active{% endif %}">
          <i class="bi bi-speedometer2 me-2"></i>Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a href="/containers" class="nav-link text-light {% if request.path.startswith('/containers') %}active{% endif %}">
          <i class="bi bi-box-seam me-2"></i>Containers
        </a>
      </li>
      <li class="nav-item">
        <a href="/images" class="nav-link text-light {% if request.path == '/images' %}active{% endif %}">
          <i class="bi bi-layers me-2"></i>Images
        </a>
      </li>
      <li class="nav-item">
        <a href="/volumes" class="nav-link text-light {% if request.path == '/volumes' %}active{% endif %}">
          <i class="bi bi-database me-2"></i>Volumes
        </a>
      </li>
      <li class="nav-item">
        <a href="/networks" class="nav-link text-light {% if request.path == '/networks' %}active{% endif %}">
          <i class="bi bi-diagram-3 me-2"></i>Networks
        </a>
      </li>
      <li class="nav-item">
        <a href="/graphs" class="nav-link text-light {% if request.path == '/graphs' %}active{% endif %}">
          <i class="bi bi-graph-up me-2"></i>Graphs
        </a>
      </li>
      <li class="nav-item">
        <a href="/hosts" class="nav-link text-light {% if request.path == '/hosts' %}active{% endif %}">
          <i class="bi bi-hdd-stack me-2"></i>Hosts
        </a>
      </li>
    </ul>

    <div class="mb-3 mt-3">
      <label class="text-muted" style="font-size:0.7rem; text-transform:uppercase; letter-spacing:.06em;">Host</label>
      <div id="host-list" class="mt-1 d-flex flex-column gap-1">
        <button class="host-item nav-link text-light w-100 text-start active" data-id="local">
          <span class="status-dot dot-red me-2"></span>Local
        </button>
      </div>
    </div>

    <div class="pt-3 border-top border-secondary">
      <small class="text-muted d-flex align-items-center gap-2">
        <span id="daemon-dot" class="status-dot {% if connected %}dot-green{% else %}dot-red{% endif %}"></span>
        <span id="daemon-label">{% if connected %}Daemon connected{% else %}Daemon offline{% endif %}</span>
      </small>
    </div>
  </div>

  <!-- Main content -->
  <div class="flex-grow-1 d-flex flex-column" style="min-width: 0;">
    <header class="topbar px-3 px-md-4 py-3 d-flex align-items-center border-bottom border-secondary gap-2">
      <!-- Hamburger — mobile only -->
      <button class="btn btn-link text-secondary d-md-none p-0 border-0 lh-1"
              data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-label="Open menu">
        <i class="bi bi-list fs-3"></i>
      </button>
      <h6 class="mb-0 text-muted">{% block header %}{% endblock %}</h6>
    </header>

    <main class="flex-grow-1 p-3 p-md-4">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
  <div id="toast" class="toast align-items-center text-bg-danger border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toast-body">Error</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function showToast(msg, type = 'danger') {
    const el = document.getElementById('toast');
    el.className = `toast align-items-center text-bg-${type} border-0`;
    document.getElementById('toast-body').textContent = msg;
    bootstrap.Toast.getOrCreateInstance(el, { delay: 4000 }).show();
  }

  function csrfFetch(url, options = {}) {
    const token = document.querySelector('meta[name="csrf-token"]').content;
    const headers = new Headers(options.headers || {});
    headers.set('X-CSRF-Token', token);
    return fetch(url, { ...options, headers });
  }
</script>
<script src="/static/js/host.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
